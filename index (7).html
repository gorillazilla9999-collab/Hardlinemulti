<script>
// ===== HARDLINE multiplayer (loaded after the game script) =====
// Model: every player simulates their own character and vehicle. Other players appear as "puppets"
// that are driven by streamed state and inputs. A player's damage is always decided by the shooter's
// client and delivered to the victim, who applies it and announces the kill. The host controls round flow.

#mpui input{width:100%;box-sizing:border-box;padding:10px;background:#0b0f12;border:1px solid #34414a;color:#fff;font-size:16px}

function connect(first){

  errMsg='Connecting…';draw();
  try{ws=new WebSocket(url)}catch(e){errMsg='Bad server address.';draw();return}
  ws.onopen=()=>{errMsg='';first.name=name;send(first)};
  ws.onerror=()=>{if(!NET.id){errMsg='Could not reach the server.';draw()}};
  ws.onclose=()=>{if(NET.id||NET.on){alert('Disconnected from the server.');leaveAll(false)}};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}onServer(m)};

}

  else if(m.t=='room'){roster=m.players;hostId=m.host;roomCode=m.code;started=m.started;NET.host=NET.id===hostId?1:0;btn.textContent='Room '+roomCode;draw();
    if(NET.on)for(const id in NET.ents)if(!roster.find(p=>p.id==id))dropEnt(+id)}
  else if(m.t=='left'){dropEnt(m.id)}
  else if(m.t=='closed'){alert(m.m);leaveAll(false)}
  else if(m.t=='m')onRel(m.from,m.d);
}
function leaveAll(rejoinMenu){
  try{if(ws){ws.onclose=null;ws.close()}}catch(e){}ws=null;clearInterval(pingT);
  for(const id in NET.ents)dropEnt(+id);
  NET.pend=null;const wasOn=NET.on;NET.on=0;NET.host=0;NET.id=0;roster=[];roomCode='';started=false;btn.textContent='Multiplayer';st$.textContent='';
  if(wasOn&&st!='menu')toMenu();
  draw();
}

// ---------------------------------------------------------------- match start

  if(NET.id!==hostId)return;
  const pl=roster.map(p=>({id:p.id,name:p.name,team:p.team}));
  if(!pl.some(p=>p.team===0)||!pl.some(p=>p.team===1)){errMsg='Each team needs at least one player.';draw();return}
  const cfg={map:S.map,rl:S.rl,ff:S.ff,players:pl};
  send({t:'started',v:1});rel({start:cfg});begin(cfg);
}
function begin(cfg){
  const p=cfg.players.find(q=>q.id===NET.id);if(!p)return;

}

  _buildTeams.apply(this,arguments);
  if(!NET.on)return;
  for(const id in NET.ents)dropEnt(+id);
  let i=0;
  for(const pl of NET.cfg.players){if(pl.id===NET.id)continue;
    const e=mkBot(pl.team,i++);Object.assign(e,{rp:1,id:pl.id,name:pl.name,tx:0,ty:0,tz:0,tyaw:0,pv:null,vk:null,mv:0,cr:0,k:0,d:0});
    e.mesh.visible=false;ALL.push(e);NET.ents[pl.id]=e}
};
function dropEnt(id){
  const e=NET.ents[id];if(!e)return;
  dropPuppet(e);try{sc.remove(e.mesh)}catch(x){}
  const k=ALL.indexOf(e);if(k>=0)ALL.splice(k,1);delete NET.ents[id];
}
function dropPuppet(e){const v=e.pv;e.pv=null;e.pvk=null;e.inV=null;if(v){v.bot=null;v.rm=1;v.m.visible=false}}

// ---------------------------------------------------------------- sending my state
function myState(){
  const v=P.veh,f=n=>+(+n).toFixed(2),o={x:f(P.x),y:f(P.y),z:f(P.z),yw:+P.yaw.toFixed(3),pt:+P.pit.toFixed(2),al:P.alive?1:0,cr:P.cr?1:0,mv:(K.KeyW||K.KeyA||K.KeyS||K.KeyD)?1:0};
  if(v&&P.alive&&VP[v.i]){
    o.v=VP[v.i][0];o.vs=[v.x,v.y,v.z,v.yaw,v.wy,v.sp,v.vy||0,v.roll||0,v.pa||0,v.thr||0,v.dv||0].map(f);
    const I=NET.myin;
    if(I){o.in=[I.f||0,I.s||0,I.up?1:0,I.dn?1:0,I.brake?1:0,I.fire?1:0,I.mg?1:0,I.rkt?1:0,I.msl?1:0,I.st||0,I.aam?1:0,I.ssm?1:0,I.saa?1:0,I.ltm?1:0,I.bomb?1:0,+(I.yaw||0).toFixed(3),+(I.pit||0).toFixed(3),+(I.wy||0).toFixed(3)];
      if(I.aim){try{const a=I.aim();if(a)o.ax=[f(a.x),f(a.y),f(a.z)]}catch(e){}}}
  }
  return o;
}
setInterval(()=>{
  if(!NET.on||!ws||(st!='live'&&st!='cd'&&st!='end'&&st!='inter'))return;
  rel({s:myState()});
  if(NET.host){const t=performance.now();if(t-lastSync>1000){lastSync=t;rel({y:{c:clock|0,s:score.slice(),w:wins.slice(),st}})}}
},50);

// ---------------------------------------------------------------- receiving
function onRel(from,d){
  if(!NET.on&&d.start){NET.pend=d.start;ui.hidden=false;draw();return}
  if(!NET.on)return;
  const e=NET.ents[from];
  if(d.s&&e){
    const s=d.s;e.tx=s.x;e.ty=s.y;e.tz=s.z;e.tyaw=s.yw;e.pit=s.pt;e.cr=s.cr;e.mv=s.mv;
    if(s.al&&!e.alive){e.alive=1;e.hp=100;if(!e.pv)e.mesh.visible=true;e.x=s.x;e.y=s.y;e.z=s.z;e.yaw=s.yw}
    else if(!s.al&&e.alive){e.alive=0;e.hp=0;e.mesh.visible=false;dropPuppet(e)}
    e.vk=s.v||null;e.vs=s.vs||null;e.vin=s.in||null;e.vax=s.ax||null;
  }else if(d.hit){ // I was shot on foot
    if(P.alive&&!P.veh&&e){NET.ap=1;try{dmg(P,d.hit[0],e,d.hit[1])}finally{NET.ap=0}}
  }else if(d.vh){ // my vehicle was hit
    if(P.alive&&P.veh&&e){NET.ap=1;try{vhitv(P.veh,d.vh,e)}finally{NET.ap=0}}
  }else if(d.k){ // someone died
    const v=e;if(!v)return;
    let k=d.k.k===null||d.k.k===undefined?null:byId(d.k.k);
    if(!k)k={team:d.k.kt,k:0,d:0,name:d.k.kn||'Wreck'};
    NET.ap=1;try{kill(v,k,d.k.tg||'')}finally{NET.ap=0}
  }else if(d.vb){ // their vehicle blew up
    if(e&&e.pv){const v=e.pv;fxBoom(v);v.dead=1;v.rt=15;v.m.visible=false;puff(v.x,v.y+1.5,v.z,6);snda('crumble',v.x,v.z,.5,.6);v.bot=null;e.pv=null;e.pvk=null;e.inV=null}
  }else if(d.tr){ // their on-foot tracer
    const T=THREE;mkTr(new T.Vector3(...d.tr[0]),new T.Vector3(...d.tr[1]));snda('gun',d.tr[0][0],d.tr[0][2],.6)
  }else if(d.y&&!NET.host){ // host sync
    if(st=='live'||st=='cd'){clock=d.y.c;for(let i=0;i<4;i++)score[i]=d.y.s[i]||0;for(let i=0;i<4;i++)wins[i]=d.y.w[i]||0}
  }else if(d.end&&!NET.host){_endRound(d.end.fw,d.end.why)}
  else if(d.round&&!NET.host){flip^=1;startRound()}
}
// shooter-side delivery of damage
NET.hit=(e,n,tg)=>rel({hit:[Math.round(n*10)/10,tg||'']},e.id);
NET.vhit=(B,n)=>rel({vh:Math.round(n*10)/10},B.id);
NET.sendRound=()=>rel({round:1});

// ---------------------------------------------------------------- per frame: move puppets
const _bupd=bupd;
bupd=function(dt){if(NET.on)puppets(dt);return _bupd.apply(this,arguments)};
function puppets(dt){
  const k=Math.min(1,dt*12);
  for(const id in NET.ents){const e=NET.ents[id];
    if(e.pv&&(e.pv.dead||!VS.includes(e.pv))){e.pv=null;e.pvk=null;e.inV=null}
    if(e.vk&&e.alive){
      if(!e.pv||e.pvk!==e.vk){
        dropPuppet(e);
        const v=tmpVeh(e.vk,e.team);
        if(v){v.bot=e;e.inV=v;e.pv=v;e.pvk=e.vk;v.id=0;v.hp=v.mx;v.lb=null;e.snap=1;e.mesh.visible=false}
      }
      if(e.pv){e.x=e.pv.x;e.y=e.pv.y;e.z=e.pv.z;e.yaw=e.pv.yaw;e.mesh.visible=false}
    }else{
      if(e.pv)dropPuppet(e);
      if(e.alive){
        const dd=Math.hypot(e.tx-e.x,e.tz-e.z);
        if(dd>15||e.mesh.visible===false){e.x=e.tx;e.y=e.ty;e.z=e.tz;e.yaw=e.tyaw}
        else{e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;e.z+=(e.tz-e.z)*k;e.yaw+=nm(e.tyaw-e.yaw)*k}
        e.mesh.visible=true;e.mesh.position.set(e.x,e.y,e.z);e.mesh.rotation.y=e.yaw;e.mesh.scale.y=e.cr?.82:1;
        const sw=e.mv?Math.sin(performance.now()/180+(e.wx||0))*.7:0;
        if(e.mesh.userData.l){e.mesh.userData.l.rotation.x=sw;e.mesh.userData.r.rotation.x=-sw}
      }else e.mesh.visible=false;
    }
  }
  const T=document.getElementById('mpst');
  if(T){T.textContent=NET.host?'HOST · '+roomCode+' · '+(Object.keys(NET.ents).length+1)+' players':'Room '+roomCode+' · '+(Object.keys(NET.ents).length+1)+' players'}
}
// input source for a puppet-driven vehicle (replaces the bot AI)
NET.vin=function(v,B,dt){
  const s=B.vs;
  if(s){
    const dx=s[0]-v.x,dy=s[1]-v.y,dz=s[2]-v.z,d=Math.hypot(dx,dy,dz);
    if(d>12||B.snap){v.x=s[0];v.y=s[1];v.z=s[2];v.yaw=s[3];v.wy=s[4];v.sp=s[5];v.vy=s[6];v.roll=s[7];v.pa=s[8];v.thr=s[9];v.dv=s[10];B.snap=0}
    else{const q=Math.min(1,dt*5);v.x+=dx*q;v.y+=dy*q;v.z+=dz*q;v.yaw+=nm(s[3]-v.yaw)*q;v.sp+=(s[5]-v.sp)*q;v.vy+=(s[6]-v.vy)*q;v.roll+=(s[7]-v.roll)*q;v.thr+=(s[9]-v.thr)*q;v.dv+=(s[10]-v.dv)*q}
  }
  // puppets never run dry or die locally; the owner decides that
  v.hp=v.mx;v.ms=99;v.bm=Infinity;v.fl=8;v.ams=99;v.lms=99;v.rk=Math.max(v.rk||0,6);if(v.D.tp)v.tp=v.D.tp;v.sms=8;v.sas=8;v.cd=Math.min(v.cd,.5);
  const a=B.vin||[],I={f:a[0]||0,s:a[1]||0,up:a[2],dn:a[3],brake:a[4],fire:a[5],mg:a[6],rkt:a[7],msl:a[8],st:a[9]||0,aam:a[10],ssm:a[11],saa:a[12],ltm:a[13],bomb:a[14],yaw:a[15]||v.yaw,pit:a[16]||0,wy:a[17]===undefined?v.wy:a[17],aim:null};
  if(B.vax){const ax=B.vax;I.aim=()=>new THREE.Vector3(ax[0],ax[1],ax[2])}
  return I;
};

// ---------------------------------------------------------------- damage routing
const _dmg=dmg;
dmg=function(e,n,by,tg){
  if(NET.on&&!NET.ap){
    if(by&&by.rp)return;                       // a remote player's damage is decided on their own client
    if(e&&e.rp&&!e.inV){if(e.alive&&st=='live')NET.hit(e,n,tg);return}
  }
  return _dmg(e,n,by,tg);
};
const _vhitv=vhitv;
vhitv=function(v,n,by){
  if(NET.on&&!NET.ap){
    if(by&&by.rp)return;
    if(v&&v.bot&&v.bot.rp){if(!v.dead)NET.vhit(v.bot,n);return}
  }
  return _vhitv(v,n,by);
};
const _kill=kill;
kill=function(e,by,tg){
  if(NET.on&&e===P&&P.alive){rel({k:{k:by&&by.id!==undefined?by.id:null,kt:by?by.team:0,kn:by&&by.name||'',tg:tg||''}})}
  return _kill(e,by,tg);
};
const _boom=boom;
boom=function(v){
  if(NET.on){
    if(v.bot&&v.bot.rp){fxBoom(v);v.dead=1;v.rt=15;v.m.visible=false;puff(v.x,v.y+1.5,v.z,6);snda('crumble',v.x,v.z,.5,.6);const b=v.bot;v.bot=null;b.inV=null;b.pv=null;b.pvk=null;return}
    if(P.veh===v)rel({vb:1});
  }
  return _boom(v);
};
// my own on-foot shots are shown to others
const _fire=fire;let inFire=0;
fire=function(){inFire=1;try{return _fire.apply(this,arguments)}finally{inFire=0}};
const _mkTr=mkTr;
mkTr=function(a,b,c){if(NET.on&&inFire)rel({tr:[[+a.x.toFixed(1),+a.y.toFixed(1),+a.z.toFixed(1)],[+b.x.toFixed(1),+b.y.toFixed(1),+b.z.toFixed(1)]]});return _mkTr(a,b,c)};

// ---------------------------------------------------------------- round flow (host decides)
const _endRound=endRound;
endRound=function(fw,why){
  if(NET.on&&NET.host)rel({end:{fw,why}});
  return _endRound(fw,why);
};
const _resetV=resetV;
resetV=function(){_resetV.apply(this,arguments);if(NET.on)VS.forEach(v=>{if(!v.tmp){v.dead=1;v.rt=1e9;v.m.visible=false}})}; // only personal vehicles in multiplayer
const _spawnInVeh=spawnInVeh;
spawnInVeh=function(){
  _spawnInVeh.apply(this,arguments);
  if(NET.on&&P.veh&&P.veh.tmp){const i=NET.cfg.players.findIndex(p=>p.id===NET.id),v=P.veh,sh=(i-3.5)*9;v.x=clamp(v.x+sh,-70*BF,70*BF);P.x=v.x}
};
const _pause=pause;
pause=function(v){if(NET.on){$$('ps').hidden=!v;$$('pset').hidden=true;return}return _pause(v)};
const _toMenu=toMenu;
toMenu=function(){if(NET.on){leaveAll(false);return}return _toMenu.apply(this,arguments)};
document.addEventListener('keydown',e=>{if(e.code=='Backquote'&&NET.on){ui.hidden=!ui.hidden;draw()}});
})();

</script></body></html>
